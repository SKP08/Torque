[project]
name = "torque"
version = "0.1.0"
description = "Torque - Personal AI Operating System for Windows"
readme = "README.md"
authors = [
    { name = "Shubh Patel", email = "patelshubh612@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "keyboard>=0.13.5",
    "langchain>=1.3.14",
    "langgraph>=1.2.10",
    "loguru>=0.7.3",
    "mss>=10.2.0",
    "ollama>=0.6.2",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "pynput>=1.8.2",
    "pyside6>=6.11.1",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
]

[project.scripts]
torque = "torque.main:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
