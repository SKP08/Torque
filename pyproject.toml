[project]
name = "torque"
version = "0.1.0"
description = "Torque - personal voice AI assistant for Windows"
readme = "README.md"
authors = [
    { name = "Shubh Patel", email = "patelshubh612@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "faster-whisper>=1.2.0",
    "keyboard>=0.13.5",
    "loguru>=0.7.3",
    "maxminddb>=2.6.0",
    "numpy>=2.3.2",
    "onnxruntime>=1.20.0",
    "ollama>=0.6.2",
    "pillow>=12.3.0",
    "piper-tts>=1.6.0",
    "psutil>=7.2.2",
    "pystray>=0.19.5",
    "python-dotenv>=1.2.2",
    "rapidfuzz>=3.14.5",
    "setuptools>=83.0.0",
    "sounddevice>=0.5.2",
    "tavily-python>=0.7.27",
    "websockets>=15.0.1",
]

[project.optional-dependencies]
# Local OCR for "what's this error?" (bundles its models, works offline).
screen = ["rapidocr-onnxruntime>=1.2.3"]
# Browser agent ("go to wikipedia.org and read it"). Uses the Edge that ships with Windows.
browser = ["playwright>=1.49"]
# Search your PDFs and Word files ("what do my notes say about Kerberos?"). Plain text works without it.
docs = ["pypdf>=5.0", "python-docx>=1.1"]
# Natural offline voice (Kokoro). Needs the model files: python -m torque.audio.voice_download
voice = ["phonemizer>=3.3.0", "espeakng-loader>=0.2.4"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
torque = "torque.main:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
