[project]
name = "torque"
version = "0.1.0"
description = "Torque - personal voice AI assistant for Windows"
readme = "README.md"
authors = [
    { name = "Shubh Patel", email = "patelshubh612@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "faster-whisper>=1.2.0",
    "keyboard>=0.13.5",
    "loguru>=0.7.3",
    "numpy>=2.3.2",
    "onnxruntime>=1.20.0",
    "ollama>=0.6.2",
    "pillow>=12.3.0",
    "piper-tts>=1.6.0",
    "psutil>=7.2.2",
    "pystray>=0.19.5",
    "python-dotenv>=1.2.2",
    "rapidfuzz>=3.14.5",
    "setuptools>=83.0.0",
    "sounddevice>=0.5.2",
    "tavily-python>=0.7.27",
    "websockets>=15.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
torque = "torque.main:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
