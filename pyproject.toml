[project]
name = "torque"
version = "0.1.0"
description = "Torque - Personal AI Operating System for Windows"
readme = "README.md"
authors = [
    { name = "Shubh Patel", email = "patelshubh612@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "keyboard>=0.13.5",
    "langchain>=1.3.14",
    "langgraph>=1.2.10",
    "loguru>=0.7.3",
    "mss>=10.2.0",
    "numpy>=2.3.2",
    "ollama>=0.6.2",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "pynput>=1.8.2",
    "pyopengl>=3.1.10",
    "pyside6>=6.11.1",
    "pystray>=0.19.5",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "qt-material>=2.17",
    "sounddevice>=0.5.2",
    "soundfile>=0.13.1",
    "silero-vad>=6.0.0",
    "faster-whisper>=1.2.0",
    "websockets>=15.0.1",
    "kokoro>=0.9.4",
    "setuptools>=83.0.0",
    "piper-tts>=1.6.0",
    "tavily-python>=0.7.27",
    "rapidfuzz>=3.14.5",
]

[project.scripts]
torque = "torque.main:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
